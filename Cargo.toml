[package]
name = "rach"
version = "0.2.0"
edition = "2021"
description = "Rach — write simply, run everywhere"
authors = ["Rach Project"]

[[bin]]
name = "rach"
path = "src/main.rs"

[dependencies]
serde_json = "1"
thiserror = "2.0.21"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
strip = true

[dev-dependencies]
criterion = "0.8.2"
insta = "1.48.0"

[[bench]]
name = "pipeline"
harness = false
